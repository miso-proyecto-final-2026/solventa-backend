name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: pruebas (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identidad, cotizacion, perfilamiento, siniestros]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r ../../requirements-dev.txt
      - name: Lint (ruff)
        working-directory: .
        run: ruff check services/${{ matrix.service }}
      - name: Pruebas unitarias, de propiedades, de módulo y de contrato (pytest)
        # Las pruebas de módulo levantan PostgreSQL y Redis con testcontainers (Docker del runner).
        run: pytest --cov=app --cov-report=xml --junitxml=reports/junit.xml
      - name: Cobertura mínima del 80 % en los módulos de negocio de cotización
        if: matrix.service == 'cotizacion'
        run: coverage report --include="app/cotizacion/*" --fail-under=80
      - name: Cobertura mínima del 80 % en los módulos de negocio de perfilamiento
        if: matrix.service == 'perfilamiento'
        run: coverage report --include="app/perfilamiento/*" --fail-under=80
      - name: Cobertura mínima del 80 % en los módulos de negocio de siniestros
        if: matrix.service == 'siniestros'
        run: coverage report --include="app/siniestros/*" --fail-under=80
      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/reports/junit.xml
            services/${{ matrix.service }}/coverage.xml

  # Lógica del despliegue por comentario (deploy-staging.yml): qué servicios toca un PR.
  pruebas-cd:
    name: pruebas (cd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest .github/scripts

  # Plantilla del cliente de eventos (HS2): se prueba contra un Kafka real en Docker, aparte de los servicios que la copian.
  pruebas-plantilla-eventos:
    name: pruebas (plantilla de eventos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/plantillas/eventos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r ../../../requirements-dev.txt
      - name: Lint (ruff)
        working-directory: .
        run: ruff check docs/plantillas/eventos
      - name: Pruebas (pytest, Kafka real con testcontainers)
        run: pytest

  # Check agregado `test`: es el contexto que exige la protección de `main`; resume la matriz.
  test:
    name: test
    needs: [pruebas, pruebas-cd, pruebas-plantilla-eventos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que las pruebas de todos los servicios pasaron
        run: |
          test "${{ needs.pruebas.result }}" = "success"
          test "${{ needs.pruebas-cd.result }}" = "success"
          test "${{ needs.pruebas-plantilla-eventos.result }}" = "success"

  build:
    name: build (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identidad, cotizacion, perfilamiento, siniestros]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t solventa-${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
