openapi: 3.1.0
info:
  title: Solventa - API de cotización (HU12, HU14, HU11, HU38)
  version: 1.3.0
  description: |
    Contrato del motor de rating de MS Cotización, compartido por los canales
    móvil, web y API de socios. Se diseña antes que el código (contract-first) y
    una prueba de contrato verifica que la implementación lo cumple.

    **Moneda y redondeo.** Todos los montos están en COP, son enteros (sin
    decimales) y se redondean con ROUND_HALF_UP en cada componente, de modo que
    la suma de `componentes` es exactamente igual a `prima_anual`.

    **Tres resultados de precio.**
    - *Normal*: el perfil trae señales de Open Finance y ajustan el factor de riesgo.
    - *Aproximada* (`aproximada = true`): el cliente no dio consentimiento. Se usa
      el factor base del producto y el precio puede cambiar al comprar.
    - *Degradada* (`degradado = true`): el proveedor de datos falló. Se aplica la
      regla conservadora (recargo configurable). La cotización se emite igual (HTTP 201).

    **Compatibilidad (RQ-I2).** La versión va en la ruta (`/v1`). Dentro de `v1`
    solo se agregan campos opcionales; los clientes deben ignorar campos desconocidos.

    **Auditoría (HU14).** `GET /v1/cotizaciones/{id}/desglose` entrega cómo se
    calculó el precio. Solo la consulta un auditor: se autentica con una clave de
    servicio dedicada en la cabecera `X-Service-Key` (solución provisional hasta
    que exista la gestión de roles internos). Sin cabecera responde 401; con una
    clave sin permiso, 403; si ninguna clave está configurada nadie accede.

    **Trazabilidad de datos externos (HU11).** Cada consulta a un proveedor (y su
    omisión por falta de consentimiento) deja un registro inmutable con solo
    metadatos y referencias: nunca la respuesta del proveedor ni datos personales.
    `GET /v1/cotizaciones/{id}/consultas-externas` las lista en orden temporal con
    la misma credencial de auditor. El registro se escribe de forma asíncrona: puede
    tardar un instante en aparecer tras emitir la cotización. La solicitud acepta y
    devuelve `X-Correlation-Id` para enlazar registros con trazas y logs.

    **Cotización asistida (HU38).** Un asesor cotiza a nombre de un cliente con
    `POST /v1/asesor/cotizaciones`; usa el mismo motor, así que para la misma entrada
    el precio es idéntico al de `POST /v1/cotizaciones`. Se autentica con un token
    Bearer (JWT) emitido por MS Identidad con rol `ASESOR` (solución provisional hasta
    OIDC): sin token o vencido responde 401 y con otro rol, 403. Se indica exactamente
    uno de `cliente_id` (cliente existente) o `documento` (prospecto sin cuenta: se
    cotiza con el perfil por defecto, `aproximada = true`). La respuesta agrega
    `perfil_fuente` (`REAL`, `POR_DEFECTO` o `DEGRADADO`), `canal` y `sin_cuenta`.
    `GET /v1/asesor/clientes/{cliente_id}/perfil` resume el perfil en niveles
    (`BAJO`, `MEDIO`, `ALTO`), nunca con las cifras del cliente. `GET /v1/productos`
    lista los productos y los campos de `datos` (con `ETag`), para armar el formulario.

    **Datos del producto.** `datos` es un objeto cuyos campos dependen del
    producto y viven en las reglas versionadas, no en este contrato: agregar un
    ramo no cambia la API. Los campos de los productos iniciales están en los ejemplos.
servers:
  - url: http://localhost:8000
    description: Local (docker compose)
tags:
  - name: cotizaciones
  - name: auditoria
  - name: asesor
  - name: productos
paths:
  /v1/cotizaciones:
    post:
      tags: [cotizaciones]
      operationId: crearCotizacion
      summary: Calcula y emite una cotización
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCotizacion'
            examples:
              microseguro_vida:
                summary: Microseguro de vida
                value:
                  cliente_id: 3f0c1c0e-7f4e-4a52-9f0e-5a3b1c2d4e61
                  producto: microseguro_vida
                  datos:
                    edad: 35
                    suma_asegurada: 50000000
              proteccion_dispositivos:
                summary: Protección de dispositivos
                value:
                  cliente_id: 3f0c1c0e-7f4e-4a52-9f0e-5a3b1c2d4e61
                  producto: proteccion_dispositivos
                  datos:
                    tipo_dispositivo: celular
                    valor_dispositivo: 2500000
                    antiguedad_meses: 8
      responses:
        '201':
          description: Cotización emitida (también cuando es aproximada o degradada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
              examples:
                normal:
                  summary: Con señales de Open Finance
                  value:
                    id: 9a7d6b52-2f43-4a39-8d55-0c9f7e1a2b10
                    cliente_id: 3f0c1c0e-7f4e-4a52-9f0e-5a3b1c2d4e61
                    producto: microseguro_vida
                    estado: EMITIDA
                    moneda: COP
                    prima_anual: 175000
                    prima_mensual: 14583
                    coberturas:
                      - {tipo: muerte, monto: 50000000, deducible: 0}
                      - {tipo: incapacidad_total, monto: 25000000, deducible: 0}
                    vigente_hasta: '2026-11-11T15:00:00Z'
                    version_reglas: 2026.10.1-prototipo
                    degradado: false
                    aproximada: false
                    aviso: null
                    componentes:
                      - {concepto: prima_base, monto: 175000}
                      - {concepto: ajuste_datos, monto: 0}
                      - {concepto: ajuste_riesgo, monto: 0}
                      - {concepto: recargo_degradado, monto: 0}
                    metadata: {hit_cache: true, latencia_interna_ms: 12.4}
                aproximada:
                  summary: Sin consentimiento (precio aproximado)
                  value:
                    id: 1c2e0f31-6d0a-4c53-bb36-52d5f0a9e7aa
                    cliente_id: 3f0c1c0e-7f4e-4a52-9f0e-5a3b1c2d4e61
                    producto: proteccion_dispositivos
                    estado: EMITIDA
                    moneda: COP
                    prima_anual: 135844
                    prima_mensual: 11320
                    coberturas:
                      - {tipo: dano_accidental, monto: 2500000, deducible: 250000}
                      - {tipo: robo, monto: 2500000, deducible: 500000}
                    vigente_hasta: '2026-11-11T15:00:00Z'
                    version_reglas: 2026.10.1-prototipo
                    degradado: false
                    aproximada: true
                    aviso: Este valor es aproximado y puede cambiar al momento de la compra.
                    componentes:
                      - {concepto: prima_base, monto: 112500}
                      - {concepto: ajuste_datos, monto: 16875}
                      - {concepto: ajuste_riesgo, monto: 6469}
                      - {concepto: recargo_degradado, monto: 0}
                    metadata: {hit_cache: false, latencia_interna_ms: 6.1}
                degradada:
                  summary: Proveedor de datos caído (regla conservadora)
                  value:
                    id: 5b8e4d77-91c3-4a0e-a8d4-7e2f6c3b1d09
                    cliente_id: 3f0c1c0e-7f4e-4a52-9f0e-5a3b1c2d4e61
                    producto: microseguro_vida
                    estado: EMITIDA
                    moneda: COP
                    prima_anual: 201250
                    prima_mensual: 16771
                    coberturas:
                      - {tipo: muerte, monto: 50000000, deducible: 0}
                      - {tipo: incapacidad_total, monto: 25000000, deducible: 0}
                    vigente_hasta: '2026-11-11T15:00:00Z'
                    version_reglas: 2026.10.1-prototipo
                    degradado: true
                    aproximada: false
                    aviso: null
                    componentes:
                      - {concepto: prima_base, monto: 175000}
                      - {concepto: ajuste_datos, monto: 0}
                      - {concepto: ajuste_riesgo, monto: 0}
                      - {concepto: recargo_degradado, monto: 26250}
                    metadata: {hit_cache: false, latencia_interna_ms: 9.8}
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /v1/cotizaciones/{id}:
    get:
      tags: [cotizaciones]
      operationId: obtenerCotizacion
      summary: Consulta una cotización emitida
      description: |
        `componentes` sale del desglose persistido al emitir. Las cotizaciones
        anteriores a HU14 no lo tienen y lo devuelven en `null`.
      parameters:
        - $ref: '#/components/parameters/CotizacionId'
      responses:
        '200':
          description: Cotización encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
        '404':
          description: La cotización no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error:
                  code: COTIZACION_NO_ENCONTRADA
                  message: La cotización no existe.
                  details: []
                  trace_id: 7f6c2f5e-0e4d-4d61-9a3e-2d1f0b7c8e55
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /v1/cotizaciones/{id}/desglose:
    get:
      tags: [auditoria]
      operationId: obtenerDesglose
      summary: Desglose del cálculo del precio (solo auditor)
      description: |
        Componentes, cada factor aplicado con su valor, recargos, versión de
        reglas y referencia al perfil usado (fuente, fecha, `degradado`). No
        incluye datos personales del cliente. Es inmutable: un recálculo genera
        una cotización nueva. Con `prima_base`, los `factores` y el recargo se
        reproduce `prima_anual` (redondeo ROUND_HALF_UP en cada paso).
      security:
        - claveAuditor: []
      parameters:
        - $ref: '#/components/parameters/CotizacionId'
      responses:
        '200':
          description: Desglose de la cotización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desglose'
              example:
                cotizacion_id: 3f1c9a52-6b1e-4f0a-9d44-0a7b1c2d3e4f
                version_esquema: 1
                version_reglas: 2026.10.1-prototipo
                producto: microseguro_vida
                moneda: COP
                prima_base: 175000
                factores:
                  - {etapa: riesgo_base, nombre: factor_riesgo_base, factor: '1.00', fuente: null, obtenido_en: null}
                  - {etapa: senal, nombre: ratio_endeudamiento, factor: '1.00', fuente: open_finance, obtenido_en: '2026-10-17T12:00:00Z'}
                recargo_degradado_pct: null
                componentes:
                  - {concepto: prima_base, monto: 175000}
                  - {concepto: ajuste_datos, monto: 0}
                  - {concepto: ajuste_riesgo, monto: 0}
                  - {concepto: recargo_degradado, monto: 0}
                prima_anual: 175000
                perfil:
                  fuentes: [open_finance, open_data]
                  degradado: false
                  con_consentimiento: true
                  completitud: 1.0
        '401':
          description: Falta la cabecera `X-Service-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error:
                  code: NO_AUTENTICADO
                  message: Se requiere la credencial de auditoría.
                  details: []
                  trace_id: 7f6c2f5e-0e4d-4d61-9a3e-2d1f0b7c8e55
        '403':
          description: La clave no tiene permiso de auditoría.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error:
                  code: SIN_PERMISO
                  message: La credencial no tiene permiso de auditoría.
                  details: []
                  trace_id: 7f6c2f5e-0e4d-4d61-9a3e-2d1f0b7c8e55
        '404':
          description: La cotización no existe, o es anterior a HU14 y no tiene desglose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /v1/cotizaciones/{id}/consultas-externas:
    get:
      tags: [auditoria]
      operationId: obtenerConsultasExternas
      summary: Consultas a proveedores externos de una cotización (solo auditor)
      description: |
        Qué se consultó, a quién, cuándo, con qué consentimiento y con qué
        resultado (`OK`, `TIMEOUT`, `DEGRADADO`, `SIN_CONSENTIMIENTO`), en orden
        temporal. `consentimiento_id` es `null` cuando Identidad no lo informa.
      security:
        - claveAuditor: []
      parameters:
        - $ref: '#/components/parameters/CotizacionId'
      responses:
        '200':
          description: Consultas que alimentaron la cotización (puede ser una lista vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultasExternas'
              example:
                cotizacion_id: 3f1c9a52-6b1e-4f0a-9d44-0a7b1c2d3e4f
                consultas:
                  - id: 0b9c1f0e-5c1d-4c0e-8a52-6f0f8c0a1a11
                    cliente_id: cli-1
                    proveedor: open_finance
                    categorias: [ingresos, endeudamiento, antiguedad_financiera]
                    consultado_en: '2026-10-18T12:00:00.120Z'
                    resultado: OK
                    latencia_ms: 41.5
                    hit_cache: false
                    consentimiento_id: 9d2a6a2e-0c3b-4d55-9d0b-2b6a1c9e7f10
                    cotizacion_id: 3f1c9a52-6b1e-4f0a-9d44-0a7b1c2d3e4f
                    correlacion_id: 7f6c2f5e-0e4d-4d61-9a3e-2d1f0b7c8e55
        '401':
          description: Falta la cabecera `X-Service-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: La clave no tiene permiso de auditoría.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: La cotización no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /v1/cotizaciones/{id}/latencia-cliente:
    put:
      tags: [cotizaciones]
      operationId: registrarLatenciaCliente
      summary: Registra la latencia medida en el cliente (RQ-L1)
      description: |
        La reporta el cliente o el generador de carga. Completa
        `latencia_cliente_ms` del registro de latencia de la cotización.
      parameters:
        - $ref: '#/components/parameters/CotizacionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LatenciaCliente'
            example: {latencia_cliente_ms: 231.5}
      responses:
        '204':
          description: Latencia registrada.
        '404':
          description: La cotización no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /v1/productos:
    get:
      tags: [productos]
      operationId: listarProductos
      summary: Productos cotizables y los campos de cada uno
      description: |
        Se deriva de las reglas versionadas. `ETag` es la versión de las reglas: con
        `If-None-Match` igual responde 304 sin cuerpo.
      responses:
        '200':
          description: Catálogo vigente.
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogo'
        '304':
          description: El catálogo no cambió.
  /v1/asesor/clientes/{cliente_id}/perfil:
    get:
      tags: [asesor]
      operationId: perfilDelCliente
      summary: Resumen del perfil del cliente para la venta asistida
      security:
        - tokenAsesor: []
      parameters:
        - name: cliente_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 36}
      responses:
        '200':
          description: Perfil en niveles. Sin consentimiento, `perfil_fuente` es `POR_DEFECTO` y no hay señales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilAsesor'
              example:
                cliente_id: 00000000-0000-4000-8000-0000000000a1
                con_consentimiento: true
                perfil_fuente: REAL
                fuentes: [open_finance, open_data]
                completitud: 1.0
                senales:
                  - {nombre: ratio_endeudamiento, nivel: BAJO}
                  - {nombre: reportes_negativos, nivel: BAJO}
                  - {nombre: ingresos_mensuales_cop, nivel: BAJO}
                obtenido_en: '2026-10-20T15:00:00Z'
        '401':
          $ref: '#/components/responses/ErrorAsesorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorAsesorSinPermiso'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /v1/asesor/cotizaciones:
    post:
      tags: [asesor]
      operationId: crearCotizacionAsistida
      summary: Calcula y emite una cotización a nombre de un cliente (asesor)
      security:
        - tokenAsesor: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAsistida'
            examples:
              cliente_existente:
                value:
                  cliente_id: 00000000-0000-4000-8000-0000000000a1
                  producto: microseguro_vida
                  datos: {edad: 35, suma_asegurada: 50000000}
              sin_cuenta:
                value:
                  documento: {tipo: CC, numero: '55667788'}
                  producto: microseguro_vida
                  datos: {edad: 35, suma_asegurada: 50000000}
      responses:
        '201':
          description: Cotización emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionAsistida'
              examples:
                cliente_con_perfil_real:
                  value:
                    id: 3c6f5a52-7d0e-4b1c-9d52-0a7f6a9c1b11
                    cliente_id: 00000000-0000-4000-8000-0000000000a1
                    producto: microseguro_vida
                    estado: EMITIDA
                    moneda: COP
                    prima_anual: 157938
                    prima_mensual: 13162
                    coberturas:
                      - {tipo: muerte, monto: 50000000, deducible: 0}
                      - {tipo: incapacidad_total, monto: 25000000, deducible: 0}
                    vigente_hasta: '2026-11-19T15:00:00Z'
                    version_reglas: 2026.10.1-prototipo
                    degradado: false
                    aproximada: false
                    aviso: null
                    componentes:
                      - {concepto: prima_base, monto: 175000}
                      - {concepto: ajuste_datos, monto: 0}
                      - {concepto: ajuste_riesgo, monto: -17062}
                      - {concepto: recargo_degradado, monto: 0}
                    perfil_fuente: REAL
                    canal: WEB_ASESOR
                    sin_cuenta: false
                sin_cuenta:
                  value:
                    id: 9a1d3c2e-5b7f-4e08-8c36-1f2e4d6a7b90
                    cliente_id: 5e0c1a44-2f6b-4d7a-9b3e-8c1d2a3b4c5d
                    producto: microseguro_vida
                    estado: EMITIDA
                    moneda: COP
                    prima_anual: 175000
                    prima_mensual: 14583
                    coberturas:
                      - {tipo: muerte, monto: 50000000, deducible: 0}
                      - {tipo: incapacidad_total, monto: 25000000, deducible: 0}
                    vigente_hasta: '2026-11-19T15:00:00Z'
                    version_reglas: 2026.10.1-prototipo
                    degradado: false
                    aproximada: true
                    aviso: Este valor es aproximado y puede cambiar al momento de la compra.
                    componentes:
                      - {concepto: prima_base, monto: 175000}
                      - {concepto: ajuste_datos, monto: 0}
                      - {concepto: ajuste_riesgo, monto: 0}
                      - {concepto: recargo_degradado, monto: 0}
                    perfil_fuente: POR_DEFECTO
                    canal: WEB_ASESOR
                    sin_cuenta: true
        '401':
          $ref: '#/components/responses/ErrorAsesorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorAsesorSinPermiso'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
components:
  securitySchemes:
    tokenAsesor:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido por MS Identidad (`POST /v1/sesiones-internas`) con rol `ASESOR`.
    claveAuditor:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Clave de servicio con permiso de auditoría (`AUDITOR_API_KEYS`).
  parameters:
    CotizacionId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 36}
  responses:
    ErrorValidacion:
      description: |
        Producto inexistente, datos incompletos o fuera de rango. No se calcula
        nada. `details[].campo` indica el campo (por ejemplo `datos.edad`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            fuera_de_rango:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: La solicitud no es válida.
                  details:
                    - {campo: datos.edad, motivo: 'debe ser menor o igual a 65'}
                  trace_id: 7f6c2f5e-0e4d-4d61-9a3e-2d1f0b7c8e55
            producto_inexistente:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: La solicitud no es válida.
                  details:
                    - {campo: producto, motivo: 'producto no existe; disponibles: microseguro_vida, proteccion_dispositivos'}
                  trace_id: 7f6c2f5e-0e4d-4d61-9a3e-2d1f0b7c8e55
    ErrorAsesorNoAutenticado:
      description: Falta el token del asesor, no es válido o venció (el cliente lo trata como sesión vencida).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          example:
            error:
              code: NO_AUTENTICADO
              message: La sesión no es válida o venció.
              details: []
              trace_id: 7f6c2f5e-0e4d-4d61-9a3e-2d1f0b7c8e55
    ErrorAsesorSinPermiso:
      description: El token es válido pero no es de un asesor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          example:
            error:
              code: SIN_PERMISO
              message: Se requiere el rol de asesor.
              details: []
              trace_id: 7f6c2f5e-0e4d-4d61-9a3e-2d1f0b7c8e55
  schemas:
    SolicitudCotizacion:
      type: object
      required: [cliente_id, producto, datos]
      properties:
        cliente_id:
          type: string
          minLength: 1
          maxLength: 36
          description: Id del cliente en MS Identidad (referencia por id, sin FK).
        producto:
          type: string
          description: Código del producto. Ver ejemplos para los productos iniciales.
        datos:
          type: object
          description: Datos del seguro. Los campos y rangos dependen del producto.
          additionalProperties:
            type: [string, integer]
    Cobertura:
      type: object
      required: [tipo, monto, deducible]
      properties:
        tipo: {type: string}
        monto: {type: integer, minimum: 0, description: Monto asegurado en COP.}
        deducible: {type: integer, minimum: 0, description: Deducible en COP.}
    Componente:
      type: object
      required: [concepto, monto]
      properties:
        concepto:
          type: string
          enum: [prima_base, ajuste_datos, ajuste_riesgo, recargo_degradado]
        monto:
          type: integer
          description: Aporte en COP a la prima anual. Puede ser negativo (descuento).
    MetadataCotizacion:
      type: object
      required: [hit_cache, latencia_interna_ms]
      properties:
        hit_cache: {type: boolean}
        latencia_interna_ms:
          type: [number, 'null']
          description: Procesamiento interno (caché, rating y persistencia).
    Cotizacion:
      type: object
      required:
        - id
        - cliente_id
        - producto
        - estado
        - moneda
        - prima_anual
        - prima_mensual
        - coberturas
        - vigente_hasta
        - version_reglas
        - degradado
        - aproximada
      properties:
        id: {type: string}
        cliente_id: {type: string}
        producto: {type: string}
        estado: {type: string, enum: [EMITIDA]}
        moneda: {type: string, enum: [COP]}
        prima_anual:
          type: integer
          minimum: 0
          description: Prima principal. Es la suma exacta de `componentes`.
        prima_mensual:
          type: integer
          minimum: 0
          description: Informativa (prima anual / 12 redondeada). No entra en la suma.
        coberturas:
          type: array
          items: {$ref: '#/components/schemas/Cobertura'}
        vigente_hasta: {type: string, format: date-time}
        version_reglas: {type: string}
        degradado:
          type: boolean
          description: El proveedor de datos falló y se aplicó el recargo conservador.
        aproximada:
          type: boolean
          description: Sin consentimiento. El precio puede cambiar al comprar.
        aviso: {type: [string, 'null']}
        componentes:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Componente'}
        metadata:
          oneOf:
            - $ref: '#/components/schemas/MetadataCotizacion'
            - type: 'null'
    FactorAplicado:
      type: object
      required: [etapa, nombre, factor, fuente, obtenido_en]
      properties:
        etapa: {type: string, enum: [dato, riesgo_base, senal]}
        nombre: {type: string}
        factor:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Multiplicador decimal, como texto para no perder exactitud.
        fuente:
          type: [string, 'null']
          description: Solo en `senal`; proveedor del dato (sin el valor del cliente).
        obtenido_en: {type: [string, 'null'], format: date-time}
    PerfilUsado:
      type: object
      required: [fuentes, degradado, con_consentimiento, completitud]
      properties:
        fuentes: {type: array, items: {type: string}}
        degradado: {type: boolean}
        con_consentimiento: {type: boolean}
        completitud: {type: number, minimum: 0, maximum: 1}
    Desglose:
      type: object
      required:
        - cotizacion_id
        - version_esquema
        - version_reglas
        - producto
        - moneda
        - prima_base
        - factores
        - recargo_degradado_pct
        - componentes
        - prima_anual
        - perfil
      properties:
        cotizacion_id: {type: string}
        version_esquema: {type: integer, description: Versión del formato del desglose.}
        version_reglas: {type: string}
        producto: {type: string}
        moneda: {type: string, enum: [COP]}
        prima_base: {type: integer, minimum: 0}
        factores:
          type: array
          items: {$ref: '#/components/schemas/FactorAplicado'}
        recargo_degradado_pct:
          type: [string, 'null']
          description: Porcentaje del recargo conservador; `null` si no hubo degradación.
        componentes:
          type: array
          items: {$ref: '#/components/schemas/Componente'}
        prima_anual:
          type: integer
          minimum: 0
          description: Igual a la suma exacta de `componentes`.
        perfil: {$ref: '#/components/schemas/PerfilUsado'}
    ConsultaExterna:
      type: object
      required:
        - id
        - cliente_id
        - proveedor
        - categorias
        - consultado_en
        - resultado
        - latencia_ms
        - hit_cache
        - consentimiento_id
        - cotizacion_id
        - correlacion_id
      properties:
        id: {type: string}
        cliente_id: {type: string, description: Referencia al cliente, no sus datos.}
        proveedor: {type: string, enum: [open_finance, open_data]}
        categorias:
          type: array
          items: {type: string}
          description: Categorías de datos consultadas.
        consultado_en: {type: string, format: date-time}
        resultado: {type: string, enum: [OK, TIMEOUT, DEGRADADO, SIN_CONSENTIMIENTO]}
        latencia_ms: {type: number, minimum: 0}
        hit_cache:
          type: boolean
          description: La respuesta vigente salió de la caché.
        consentimiento_id: {type: [string, 'null']}
        cotizacion_id: {type: [string, 'null']}
        correlacion_id: {type: [string, 'null']}
    ConsultasExternas:
      type: object
      required: [cotizacion_id, consultas]
      properties:
        cotizacion_id: {type: string}
        consultas:
          type: array
          items: {$ref: '#/components/schemas/ConsultaExterna'}
    LatenciaCliente:
      type: object
      required: [latencia_cliente_ms]
      properties:
        latencia_cliente_ms: {type: number, exclusiveMinimum: 0}
    DetalleError:
      type: object
      required: [campo, motivo]
      properties:
        campo: {type: string}
        motivo: {type: string}
    ErrorRespuesta:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, trace_id]
          properties:
            code: {type: string}
            message: {type: string}
            details:
              type: array
              items: {$ref: '#/components/schemas/DetalleError'}
            trace_id: {type: string}
    Catalogo:
      type: object
      required: [version_reglas, moneda, productos]
      properties:
        version_reglas: {type: string}
        moneda: {type: string, enum: [COP]}
        productos:
          type: array
          items:
            type: object
            required: [codigo, nombre, campos]
            properties:
              codigo: {type: string}
              nombre: {type: string}
              campos:
                type: array
                items:
                  type: object
                  required: [nombre, tipo, requerido]
                  properties:
                    nombre: {type: string}
                    tipo: {type: string, enum: [entero, texto]}
                    requerido: {type: boolean}
                    min: {type: [integer, 'null']}
                    max: {type: [integer, 'null']}
                    valores:
                      type: [array, 'null']
                      items: {type: string}
    PerfilAsesor:
      type: object
      required: [cliente_id, con_consentimiento, perfil_fuente, fuentes, completitud, senales, obtenido_en]
      properties:
        cliente_id: {type: string}
        con_consentimiento: {type: boolean}
        perfil_fuente: {type: string, enum: [REAL, POR_DEFECTO, DEGRADADO]}
        fuentes:
          type: array
          items: {type: string}
        completitud: {type: number, minimum: 0, maximum: 1}
        senales:
          type: array
          items:
            type: object
            required: [nombre, nivel]
            properties:
              nombre: {type: string}
              nivel: {type: string, enum: [BAJO, MEDIO, ALTO]}
        obtenido_en: {type: string, format: date-time}
    SolicitudAsistida:
      type: object
      required: [producto, datos]
      description: Exactamente uno de `cliente_id` o `documento`.
      properties:
        cliente_id: {type: string, minLength: 1, maxLength: 36}
        documento:
          type: object
          required: [tipo, numero]
          description: Documento de un prospecto sin cuenta; se cotiza con el perfil por defecto.
          properties:
            tipo: {type: string, minLength: 1, maxLength: 20}
            numero: {type: string, minLength: 1, maxLength: 20}
        producto: {type: string}
        datos: {type: object, additionalProperties: true}
    CotizacionAsistida:
      allOf:
        - $ref: '#/components/schemas/Cotizacion'
        - type: object
          required: [perfil_fuente, canal, sin_cuenta]
          properties:
            perfil_fuente: {type: string, enum: [REAL, POR_DEFECTO, DEGRADADO]}
            canal: {type: string, enum: [WEB_ASESOR]}
            sin_cuenta: {type: boolean}
